name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            packages: ""
            cxx: g++
            optimize: "-O3 -flto -DNDEBUG"
            optimize_ld: "-O3 -flto"
          - arch: aarch64
            packages: g++-aarch64-linux-gnu
            cxx: aarch64-linux-gnu-g++
            optimize: "-O3 -flto -mcpu=cortex-a53 -DNDEBUG"
            optimize_ld: "-O3 -flto -mcpu=cortex-a53"
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: Build
        run: |
          make -j$(nproc) platform=unix BUILD_TAG=${{ matrix.arch }} \
            CXX="${{ matrix.cxx }}" \
            OPTIMIZE="${{ matrix.optimize }}" OPTIMIZE_LD="${{ matrix.optimize_ld }}"
          mv dist/gloopy_libretro.so gloopy_libretro_linux_${{ matrix.arch }}.so
      - uses: actions/upload-artifact@v4
        with:
          name: gloopy_libretro_linux_${{ matrix.arch }}
          path: gloopy_libretro_linux_${{ matrix.arch }}.so

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc
      - run: make -j$(nproc) platform=win
      - uses: actions/upload-artifact@v4
        with:
          name: gloopy_libretro_windows_x86_64
          path: dist/gloopy_libretro.dll

  macos:
    name: macos-${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon did not exist before 11.0, so the Makefile's 10.15
          # default is not a legal deployment target for arm64.
          - arch: arm64
            minver: "11.0"
          - arch: x86_64
            minver: "10.15"
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make -j$(sysctl -n hw.ncpu) platform=osx BUILD_TAG=${{ matrix.arch }} \
            MINVERSION="-mmacosx-version-min=${{ matrix.minver }}" \
            OPTIMIZE="-O3 -flto -DNDEBUG -arch ${{ matrix.arch }}" \
            OPTIMIZE_LD="-O3 -flto -arch ${{ matrix.arch }}"
          mv dist/gloopy_libretro.dylib gloopy_libretro_macos_${{ matrix.arch }}.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: gloopy_libretro_macos_${{ matrix.arch }}
          path: gloopy_libretro_macos_${{ matrix.arch }}.dylib

  android:
    name: android-${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            platform: android_arm64
            optimize: "-O3 -flto -mcpu=cortex-a53 -DNDEBUG"
            optimize_ld: "-O3 -flto -mcpu=cortex-a53"
          - abi: arm
            platform: android_arm
            optimize: "-O3 -flto -DNDEBUG"
            optimize_ld: "-O3 -flto"
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: Build
        run: |
          make -j$(nproc) platform=${{ matrix.platform }} \
            ANDROID_NDK="${{ steps.ndk.outputs.ndk-path }}" NDK_HOST=linux-x86_64 \
            OPTIMIZE="${{ matrix.optimize }}" OPTIMIZE_LD="${{ matrix.optimize_ld }}"
          mv dist/gloopy_libretro_android.so gloopy_libretro_android_${{ matrix.abi }}.so
      - uses: actions/upload-artifact@v4
        with:
          name: gloopy_libretro_android_${{ matrix.abi }}
          path: gloopy_libretro_android_${{ matrix.abi }}.so

  # On a version tag, collect every platform's binary (macOS included — it can only
  # be built here, not locally), package one zip per platform plus the source bundle,
  # and create a DRAFT release. Draft means CI does all the building and packaging but
  # publishing stays a manual click.
  release:
    name: release
    needs: [linux, windows, macos, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: staged
          merge-multiple: true
      - name: Stage binaries into dist/
        run: |
          mkdir -p dist
          cp staged/* dist/
          cp gloopy_libretro.info dist/
          ls -l dist/
      - name: Package per-platform zips and the source bundle
        run: |
          chmod +x scripts/package-release.sh scripts/make-release-bundle.sh
          scripts/package-release.sh
          scripts/make-release-bundle.sh
          ls -l dist/
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/gloopy_libretro-*.zip dist/gloopy_libretro-*.zip.sha256 \
            dist/gloopy-*-src.tar.gz dist/gloopy-*-src.tar.gz.sha256 \
            --draft \
            --title "Gloopy ${GITHUB_REF_NAME}" \
            --notes "Draft — replace with the full release notes before publishing. Feature-complete, provided as-is without warranty, not maintained. See README.md and HANDOFF.md."
